name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Pinned v4 maintenance branch commit; Dependabot tracks action updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
