name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # 固定 v7.0.1 提交；Dependabot 跟踪 action 更新。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 显示 Swift 版本
        run: swift --version
      - name: 运行测试
        run: swift test
