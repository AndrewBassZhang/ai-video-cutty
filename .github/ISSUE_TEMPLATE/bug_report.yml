name: 缺陷报告
description: 报告 AI Video Cutty 中可复现的问题。
title: "[缺陷]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "感谢报告问题。请勿在此披露安全漏洞；请通过私密渠道向维护者报告。"
  - type: input
    id: macos-version
    attributes:
      label: macOS 版本
      placeholder: "例如：macOS 14.6"
    validations:
      required: true
  - type: dropdown
    id: media-type
    attributes:
      label: 媒体类型
      options:
        - 视频
        - 音频
        - 图像
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected-and-actual
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图
      description: 请移除个人或敏感信息。
