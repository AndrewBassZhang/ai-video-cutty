name: Bug report
description: Report a reproducible problem with MediaPreview.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Do not disclose security vulnerabilities here; report them privately to the maintainers."
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 14.6"
    validations:
      required: true
  - type: dropdown
    id: media-type
    attributes:
      label: Media type
      options:
        - Video
        - Audio
        - Image
        - Other
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected-and-actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Please remove personal or sensitive information.
